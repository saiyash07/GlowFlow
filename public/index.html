<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowFlow Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0e15;
            --card-bg: rgba(22, 24, 37, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-glow: rgba(0, 242, 254, 0.15);
            --text-primary: #ffffff;
            --text-secondary: #9aa0a6;
            --neon-blue: #00f2fe;
            --neon-green: #4facfe;
            --neon-red: #ff4b5c;
            --neon-purple: #7f00ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(127, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 242, 254, 0.15) 0%, transparent 40%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        /* Glassmorphic Card */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);
            pointer-events: none;
            transition: transform 0.5s ease;
        }

        /* Header Info */
        .header {
            margin-bottom: 35px;
            position: relative;
            z-index: 1;
        }

        .logo-container {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px;
            box-shadow: 0 8px 24px rgba(0, 242, 254, 0.3);
        }

        .logo-icon {
            font-size: 32px;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.2));
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #d2d4dc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Toggle Button Area */
        .toggle-section {
            margin: 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        /* Custom Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 100px;
            height: 52px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #24283b;
            transition: .4s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 34px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 42px;
            width: 42px;
            left: 5px;
            bottom: 4px;
            background-color: #3e445e;
            transition: .4s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        input:checked + .slider {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }

        input:checked + .slider:before {
            transform: translateX(46px);
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        .status-text {
            margin-top: 18px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-secondary);
            transition: color 0.3s;
        }

        .status-active {
            color: var(--neon-blue);
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
            position: relative;
            z-index: 1;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 15px;
            text-align: left;
            transition: background-color 0.3s;
        }

        .info-card:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .info-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .info-value {
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Badges */
        .badge {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .badge-green {
            background-color: #00e676;
            box-shadow: 0 0 8px #00e676;
        }

        .badge-amber {
            background-color: #ffc107;
            box-shadow: 0 0 8px #ffc107;
        }

        .badge-red {
            background-color: var(--neon-red);
            box-shadow: 0 0 8px var(--neon-red);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo-container">
                    <span class="logo-icon">✨</span>
                </div>
                <h1>GlowFlow</h1>
                <p class="subtitle">Backlight Breathing Controller</p>
            </div>

            <div class="toggle-section">
                <label class="switch">
                    <input type="checkbox" id="power-toggle" onchange="toggleState()">
                    <span class="slider"></span>
                </label>
                <div id="status-label" class="status-text">OFF</div>
            </div>

            <div class="info-grid">
                <div class="info-card">
                    <div class="info-label">Power Source</div>
                    <div id="power-source" class="info-value">
                        <span class="badge badge-green"></span> Loading...
                    </div>
                </div>
                <div class="info-card">
                    <div class="info-label">Current State</div>
                    <div id="working-state" class="info-value">
                        <span class="badge badge-green"></span> Idle
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const toggle = document.getElementById('power-toggle');
        const statusLabel = document.getElementById('status-label');
        const powerSource = document.getElementById('power-source');
        const workingState = document.getElementById('working-state');

        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                // Update switch position
                toggle.checked = (data.status === 'ON');

                // Update status label
                if (data.status === 'ON') {
                    statusLabel.textContent = 'ON';
                    statusLabel.className = 'status-text status-active';
                } else {
                    statusLabel.textContent = 'OFF';
                    statusLabel.className = 'status-text';
                }

                // Update power source info
                if (data.battery === 'Battery Power') {
                    powerSource.innerHTML = '<span class="badge badge-amber"></span> Battery';
                } else {
                    powerSource.innerHTML = '<span class="badge badge-green"></span> AC Power';
                }

                // Update working state info
                if (data.status === 'ON') {
                    if (data.paused) {
                        workingState.innerHTML = '<span class="badge badge-amber"></span> Auto-Paused';
                    } else {
                        workingState.innerHTML = '<span class="badge badge-green"></span> Breathing';
                    }
                } else {
                    workingState.innerHTML = '<span class="badge badge-red"></span> Stopped';
                }
            } catch (err) {
                console.error("Failed to fetch status:", err);
            }
        }

        async function toggleState() {
            try {
                const response = await fetch('/api/toggle', { method: 'POST' });
                const data = await response.json();
                updateStatus();
            } catch (err) {
                console.error("Failed to toggle state:", err);
            }
        }

        // Poll status every 2 seconds
        setInterval(updateStatus, 2000);
        // Initial load
        updateStatus();
    </script>
</body>
</html>
